<!doctype html>
<!-- `lang` and `dir` get rewritten by LocaleProvider once React mounts.
     The static defaults below are used for the initial paint and any
     non-JS crawlers. -->
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Brand-aware tags. Defaults are Oxy; the inline script below swaps them on FairCoin hosts before React mounts. -->
    <link id="site-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link id="site-manifest" rel="manifest" href="/manifest.webmanifest" />
    <meta id="site-theme-color" name="theme-color" content="#0a0a0b" />
    <!--
      Was `<script src="/host-meta.js">`. It has to run before first paint (it
      swaps the brand favicon/manifest/theme-color on FairCoin hosts), so as an
      external file it was a render-blocking round trip in <head> — for less
      code than the request that fetched it. Inlined here and the file deleted,
      rather than kept as a second copy that would drift. On oxy.so it returns
      on the first line.
    -->
    <script>
      (function () {
        var host = location.hostname;
        if (host !== 'fairco.in' && host !== 'www.fairco.in') return;
        // Selects the FairCoin palette out of styles/theme.generated.css. Without
        // it the apex paints Oxy purple until React applies the preset.
        document.documentElement.setAttribute('data-brand', 'faircoin');
        var overrides = [
          ['site-favicon', 'href', '/favicon-faircoin.png'],
          ['site-favicon', 'type', 'image/png'],
          ['site-manifest', 'href', '/manifest-faircoin.webmanifest'],
          ['site-theme-color', 'content', '#07120c'],
        ];
        for (var i = 0; i < overrides.length; i++) {
          var el = document.getElementById(overrides[i][0]);
          if (el) el.setAttribute(overrides[i][1], overrides[i][2]);
        }
        document.title = 'FairCoin — community-run cryptocurrency';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The app talks to these three origins on first render (auth session, CMS
      content, media). Without a hint each one costs a cold DNS + TLS handshake
      after the JS has already parsed and asked for it.
    -->
    <link rel="preconnect" href="https://api.oxy.so" crossorigin />
    <link rel="preconnect" href="https://website-api.oxy.so" crossorigin />
    <link rel="preconnect" href="https://cloud.oxy.so" crossorigin />
    <title>Oxy, an open-source ecosystem of ethical technology</title>
    <meta name="description" content="Oxy is an independent, open-source ecosystem of ethical technology built to empower people, not exploit them. Apps, AI, an operating system, a browser, identity and more." />

    <!-- Open Graph -->
    <meta property="og:title" content="Oxy, an open-source ecosystem of ethical technology" />
    <meta property="og:description" content="Oxy is an independent, open-source ecosystem of ethical technology built to empower people, not exploit them. Apps, AI, an operating system, a browser, identity and more." />
    <meta property="og:image" content="https://oxy.so/og-default.png" />
    <meta property="og:url" content="https://oxy.so" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oxy" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oxy, an open-source ecosystem of ethical technology" />
    <meta name="twitter:description" content="An independent, open-source ecosystem of ethical technology built to empower people, not exploit them." />
    <meta name="twitter:image" content="https://oxy.so/og-default.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Oxy",
      "url": "https://oxy.so",
      "logo": "https://oxy.so/favicon.svg",
      "description": "Oxy is an independent, open-source ecosystem of ethical technology built to empower people, not exploit them.",
      "sameAs": [
        "https://www.linkedin.com/company/oxyhq/",
        "https://x.com/oxyhqinc",
        "https://x.com/oxyhqes",
        "https://www.facebook.com/OxyHQInc",
        "https://mention.earth/@oxy"
      ]
    }
    </script>
  </head>
  <body>
    <script>
      // Apply the saved mode + public preset before React renders. The preset
      // declarations live in generated theme CSS, derived from Bloom's
      // FREE_COLOR_NAMES; this script carries no palette or allow-list that can
      // drift from it. An unknown/gated value matches no selector and safely
      // falls back to the generated Oxy root palette.
      (function(){
        const mode = localStorage.getItem('theme');
        if (mode === 'light') document.documentElement.classList.remove('dark');
        else document.documentElement.classList.add('dark');
        const preset = localStorage.getItem('colorPreset');
        if (preset) document.documentElement.setAttribute('data-color-preset', preset);
        else document.documentElement.removeAttribute('data-color-preset');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
