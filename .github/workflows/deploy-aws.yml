# website-api → ECR oxy/website-api → ECS service website-api (oxy-cluster, us-west-2)
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time. Two runs racing each start a deployment and each
# supersedes the other's, which is a real thing to avoid on its own and is also
# what made the rollback check below report a failure on two healthy deploys.
# Not `cancel-in-progress`: a half-finished rollout is not something to abandon.
concurrency:
  group: deploy-website-api
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: website-api
  CLUSTER: oxy-cluster
  DOCKERFILE: Dockerfile

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          SHARED="AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY REDIS_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET"
          echo "$SECRETS_JSON" | jq -r 'to_entries[] | select((.key|ascii_upcase) as $k | ($k=="GITHUB_TOKEN" or ($k|startswith("ACTIONS_")))|not) | [.key,.value]|@tsv' | \
          while IFS=$'\t' read -r k v; do
            [ -z "$k" ] && continue
            if [ -z "$v" ] || [ "$v" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $k; SSM unchanged"
              continue
            fi
            if [ "$k" = "REDIS_URL" ] && [ "$AWS_REGION" = "us-west-2" ] && ! printf '%s' "$v" | grep -q '\.usw2\.cache\.amazonaws\.com'; then
              echo "::warning::skip REDIS_URL because it does not point at the us-west-2 Valkey endpoint; SSM unchanged"
              continue
            fi
            case " $SHARED " in *" $k "*) path="/oxy/_shared/$k";; *) path="/oxy/$APP/$k";; esac
            aws ssm put-parameter --name "$path" --value "$v" --type SecureString --overwrite >/dev/null && echo "synced -> $path"
          done

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (linux/arm64)
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          docker build -f "$DOCKERFILE" -t "$IMG:${{ github.sha }}" -t "$IMG:latest" .
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:latest"

      - name: Deploy to ECS (rolling; skipped until the service exists)
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" \
            --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet — image is in ECR, skipping deploy"
            exit 0
          fi

          read -r ID STARTED <<<"$(aws ecs update-service --cluster "$CLUSTER" --service "$APP" \
            --force-new-deployment \
            --query 'service.deployments[?status==`PRIMARY`].[id,createdAt] | [0]' --output text)"
          echo "deployment $ID started $STARTED"

          # The circuit breaker can roll back and make the service stable on the
          # old image, so the waiter succeeding is not itself proof of a deploy.
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$APP" || true

          # Free text last: `read` puts the remainder in the final variable.
          read -r LIVE STATE LIVE_AT REASON <<<"$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" \
            --query 'services[0].deployments[?status==`PRIMARY`].[id,rolloutState,createdAt,rolloutStateReason] | [0]' --output text)"

          if [ "$LIVE" = "$ID" ]; then
            if [ "$STATE" != "COMPLETED" ]; then
              echo "::error::deploy did not take: $ID is $STATE — $REASON"
              aws ecs describe-services --cluster "$CLUSTER" --services "$APP" \
                --query 'services[0].events[0:8].message' --output text
              exit 1
            fi
            echo "deployed $APP ($STATE)"
          elif [ "$(date -d "$LIVE_AT" +%s)" -gt "$(date -d "$STARTED" +%s)" ]; then
            echo "::notice::superseded by $LIVE, started after this one; that run reports its own result"
          else
            echo "::error::rolled back to $LIVE (started $LIVE_AT, before this deploy) — the old image is serving"
            aws ecs describe-services --cluster "$CLUSTER" --services "$APP" \
              --query 'services[0].events[0:8].message' --output text
            exit 1
          fi
