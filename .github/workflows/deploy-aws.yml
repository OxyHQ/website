# website-api → ECR oxy/website-api → ECS service website-api (oxy-cluster, us-west-2)
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time. Two runs racing each start a deployment and each
# supersedes the other's, which is a real thing to avoid on its own and is also
# what made the rollback check below report a failure on two healthy deploys.
# Not `cancel-in-progress`: a half-finished rollout is not something to abandon.
concurrency:
  group: deploy-website-api
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: website-api
  CLUSTER: oxy-cluster
  DOCKERFILE: Dockerfile

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # The secrets are enumerated one at a time, on purpose.
      #
      # This step used to expand the entire `secrets` context with
      # `toJSON(secrets)`, and that is what held the deploys. A workflow that
      # walks every repository secret into a shell loop is shaped exactly like
      # an exfiltration payload, so GitHub creates the run with conclusion
      # `action_required` and ZERO jobs until a human clicks "Approve and run"
      # in the UI. The REST approve endpoint only serves fork pull requests, so
      # it cannot be automated, and the approval is per run — every deploy needs
      # a person. The comment on the ECS step below records the same gate biting
      # this repo before.
      #
      # Enumerating is also least privilege. The old loop copied every secret
      # visible to the repo, so the org-wide CI credentials (NPM_TOKEN,
      # CLOUDFLARE_API_TOKEN, ADD_TO_PROJECT_TOKEN) ended up in this app's SSM
      # namespace, and this repo could overwrite the /oxy/_shared/* parameters
      # that other services read.
      #
      # The list is the secrets the website-api task definition actually
      # consumes. Adding a new one means adding it here, or it never reaches SSM.
      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        env:
          APP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_FEATURE_BOARD_GITHUB_TOKEN: ${{ secrets.FEATURE_BOARD_GITHUB_TOKEN }}
          APP_INTERCOM_MESSENGER_SECRET: ${{ secrets.INTERCOM_MESSENGER_SECRET }}
          SHARED_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SHARED_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          sync_secret() {
            name="$1"; value="$2"; path="$3"
            if [ -z "$value" ] || [ "$value" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $name; SSM unchanged"
              return 0
            fi
            aws ssm put-parameter --name "$path" --value "$value" --type SecureString --overwrite >/dev/null
            echo "synced -> $path"
          }

          sync_secret DATABASE_URL "$APP_DATABASE_URL" "/oxy/$APP/DATABASE_URL"
          sync_secret FEATURE_BOARD_GITHUB_TOKEN "$APP_FEATURE_BOARD_GITHUB_TOKEN" "/oxy/$APP/FEATURE_BOARD_GITHUB_TOKEN"
          sync_secret INTERCOM_MESSENGER_SECRET "$APP_INTERCOM_MESSENGER_SECRET" "/oxy/$APP/INTERCOM_MESSENGER_SECRET"
          sync_secret AWS_ACCESS_KEY_ID "$SHARED_AWS_ACCESS_KEY_ID" "/oxy/_shared/AWS_ACCESS_KEY_ID"
          sync_secret AWS_SECRET_ACCESS_KEY "$SHARED_AWS_SECRET_ACCESS_KEY" "/oxy/_shared/AWS_SECRET_ACCESS_KEY"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (linux/arm64)
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          docker build -f "$DOCKERFILE" -t "$IMG:${{ github.sha }}" -t "$IMG:latest" .
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:latest"

      # The check lives in `scripts/deploy-ecs.sh`, where it can be read and run
      # outside a workflow run — and where editing it does not re-open the
      # workflow file for GitHub's scanner, which blocked every deploy on this
      # repo for a day the last time this logic lived here.
      - name: Deploy to ECS (rolling; skipped until the service exists)
        run: ./scripts/deploy-ecs.sh "$CLUSTER" "$APP"
