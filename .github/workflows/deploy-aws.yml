# website-api → ECR oxy/website-api → ECS service website-api (oxy-cluster, us-west-2)
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time. Two runs racing each start a deployment and each
# supersedes the other's, which is a real thing to avoid on its own and is also
# what made the rollback check below report a failure on two healthy deploys.
# Not `cancel-in-progress`: a half-finished rollout is not something to abandon.
concurrency:
  group: deploy-website-api
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: website-api
  CLUSTER: oxy-cluster
  DOCKERFILE: Dockerfile

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      # Every action this job runs is pinned to a full commit SHA, so an
      # upstream tag move cannot change what executes beside the deploy role.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A plain `docker build` starts cold on every runner. Buildx with the
      # GitHub Actions cache reuses every layer whose inputs did not change
      # (the base image and, unless package.json/bun.lock moved, the
      # `bun install` layer). Only this push-to-main / dispatch workflow and
      # refresh-build-cache.yml write the `website-api` scope; no pull_request
      # workflow does.
      #
      # Both steps run BEFORE the AWS role is assumed, and neither is a
      # third-party action: the builder is the runner's own buildx (the same
      # docker-container builder docker/setup-buildx-action created), and the
      # cache credentials come from a repo-local action.
      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --driver docker-container
          docker buildx inspect --bootstrap

      # `--cache-from/--cache-to type=gha` need the Actions runtime token and
      # cache URLs, which GitHub gives to JavaScript actions and NOT to `run:`
      # steps; without them buildx skips the cache silently.
      - name: Expose the Actions cache to buildx
        uses: ./.github/actions/expose-actions-runtime

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Runtime secrets live ONLY in SSM /oxy/website-api/* (SecureString) and
      # the oxy-infra-owned /oxy/_shared/*; the task definition reads them at
      # task start and this deploy writes none. Set or rotate one with
      # `aws ssm put-parameter --overwrite` (oxy-infra runbook 46). Until
      # 2026-10-10 a step here copied GitHub repo secrets into SSM.

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # --provenance=false keeps what reaches ECR a single linux/arm64 image
      # manifest, the same shape `docker build` + `docker push` produced, rather
      # than an index carrying an attestation.
      - name: Build and push (linux/arm64)
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --cache-from type=gha,scope=$APP \
            --cache-to type=gha,scope=$APP,mode=max,ignore-error=true \
            -f "$DOCKERFILE" \
            -t "$IMG:${{ github.sha }}" \
            -t "$IMG:latest" \
            --push \
            .

      # The check lives in `scripts/deploy-ecs.sh`, where it can be read and run
      # outside a workflow run — and where editing it does not re-open the
      # workflow file for GitHub's scanner, which blocked every deploy on this
      # repo for a day the last time this logic lived here.
      - name: Deploy to ECS (rolling; skipped until the service exists)
        run: ./scripts/deploy-ecs.sh "$CLUSTER" "$APP"
