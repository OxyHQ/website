name: Server and MCP tests

# The website review workflow builds the frontend and only runs for frontend
# paths; a change to `server/` alone — the MCP tools, their access policies,
# the shared services, a migration — ran nothing. This job gates those.

on:
  pull_request:
    paths:
      - 'server/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.server.json'
      - 'eslint.config.js'
      - '.github/workflows/server-tests.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: website_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/website_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck the server
        run: bun run typecheck:server
      - name: Lint the server
        run: bunx eslint server
      - name: Server and MCP integration suite (real PostgreSQL)
        run: bun run test:server
