name: No Mongo

# This repository has no other pull-request gate: `deploy.yml` and
# `deploy-aws.yml` both run on push to main, so anything they would have caught
# is caught AFTER the merge. A guard that only runs post-merge is a report, not
# a gate — so this one triggers on the pull request as well, which is the whole
# point of having it.
#
# It needs no install and no build: the validator reads the tracked file
# listing and the files themselves, so the job is a checkout, bun, and seconds.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-mongo:
    name: Guard against MongoDB returning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          # Matches the pin in deploy.yml and the Dockerfile.
          bun-version: 1.3.14

      # Runs the guard AND its own mutation self-test. The self-test is not
      # optional here: every part of this guard is a regex or a file listing,
      # and both fail quiet — a broken one reports a clean tree.
      - name: Guard against MongoDB returning
        run: bun run validate:no-mongo
