name: Refresh build cache

# Weekly, rebuild the production image(s) with NO cache and write the fresh
# layers into the same GitHub Actions cache scope deploy-aws.yml reads.
#
# The deploy reuses cached layers, so without this an `apt-get`/`apk` layer or
# a base-image tag would stay as old as the last time its inputs changed and
# stop picking up OS security patches. This job re-resolves the base images and
# re-runs every step, then overwrites the scope; the next real deploy builds on
# those fresh layers.
#
# It builds only: no AWS credentials, no ECR push, no deploy. It runs on the
# default branch (schedule) or a dispatch from main, so it writes main's cache,
# which only main-branch deploys read; no pull_request workflow writes a scope
# (checks.yml's image smoke reads it and never writes it).
#
# It writes the scope the deploy reads, so it builds only what the deploy would:
# the same `reviewed-image.py guard --recipe website-api` runs first, and the
# Dockerfile, context and labels come from its outputs, as in deploy-aws.yml.
# Same platform and the same pinned BuildKit too, so the layers it writes are
# the ones the deploy looks up.
#
# The base image is pinned by digest, so `--pull` re-resolves the SAME digest:
# OS and Bun patches arrive through bump-base-digests.yml, not through this job.

on:
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-build-cache
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      # Pinned and first-party only: the layers this job writes are the ones the
      # production deploy builds on, so it trusts nothing deploy-aws.yml does not.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The same pinned BuildKit as deploy-aws.yml (see the comment there).
      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --driver docker-container \
            --driver-opt image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          docker buildx inspect --bootstrap

      # `--cache-to type=gha` needs the Actions runtime token and cache URLs,
      # which GitHub gives to JavaScript actions and NOT to `run:` steps.
      - name: Expose the Actions cache to buildx
        uses: ./.github/actions/expose-actions-runtime

      # Unreviewed inputs stop here, before anything is built or cached.
      - name: Refuse unreviewed image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe website-api

      # No output: the result lives only in the exported cache. A failed export
      # fails the job, since writing the cache is the whole point. Labels as in
      # deploy-aws.yml, from the same guard outputs.
      - name: Rebuild the website-api image from scratch into the cache
        env:
          DOCKERFILE: ${{ steps.reviewed.outputs.dockerfile }}
          CONTEXT: ${{ steps.reviewed.outputs.context }}
          SOURCE_TREE: ${{ steps.reviewed.outputs.source_tree }}
          BUILD_INPUTS_SHA256: ${{ steps.reviewed.outputs.build_inputs_sha256 }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --no-cache \
            --pull \
            --cache-to type=gha,scope=website-api,mode=max \
            -f "$DOCKERFILE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "io.oxy.source.tree=$SOURCE_TREE" \
            --label "io.oxy.build-inputs.sha256=$BUILD_INPUTS_SHA256" \
            "$CONTEXT"
