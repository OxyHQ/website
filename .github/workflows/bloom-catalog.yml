name: Bloom catalog

# `src/content/bloom-catalog.generated.ts` is committed, so a plain `vite build`
# is never left without a catalog. That leaves exactly one silent way for it to
# go wrong: somebody bumps `@oxy.so/bloom` and does not re-run the generator.
# Nothing breaks — the docs keep rendering the PREVIOUS version's component
# list, which is the failure the catalog was built to end, wearing a hat.
#
# WHY A SEPARATE WORKFLOW from `no-mongo.yml`, which is the repository's other
# pull-request gate: that one reads the tracked file listing and the files
# themselves, so it is a checkout, bun, and seconds, and its comment says so.
# This one has to type-check Bloom's shipped `.d.ts` files, so it needs the
# dependencies installed. Bolting an install onto that job would slow the guard
# that does not need one and hide which check pays for it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bloom-catalog:
    name: Guard the generated Bloom catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          # Matches the pin in deploy.yml, no-mongo.yml and the Dockerfile.
          bun-version: 1.3.14

      # `--frozen-lockfile` so the catalog is checked against the Bloom version
      # the lockfile pins, not whatever resolves today. A bump that changes the
      # catalog has to arrive with the regenerated file in the same commit.
      - run: bun install --frozen-lockfile

      # Runs the gate AND its own mutation self-test. The self-test is not
      # optional: every part of this gate fails quiet — a README table that
      # stops parsing, an exports walk that stops early and a TypeScript program
      # that resolved nothing all look exactly like a package with less in it.
      - name: Check the catalog against the installed Bloom
        run: bun run validate:bloom-catalog

      # The playground's evaluation scope is generated from the demos' own
      # import statements by the same kind of committed-artifact generator, and
      # goes stale the same silent way: a demo grows an import, nobody re-runs
      # it, the build stays green and one snippet fails in the browser on a page
      # CI never opens. Same install, so it rides here rather than paying for a
      # second one. Runs its own mutation self-test too.
      - name: Check the playground scope against the demos
        run: bun run validate:bloom-live-scope
