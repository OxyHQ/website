name: Website review

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/website-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - name: Full build and existing browser gates
        run: bun run build
        env:
          VITE_API_URL: https://website-api.oxy.so
      - name: Review brand interactions and landing layouts
        run: bun scripts/website-review.browser.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: website-review
          path: review-artifacts/
          if-no-files-found: warn
          retention-days: 14
