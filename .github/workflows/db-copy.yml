# One-off Mongo → Postgres copy, run INSIDE the VPC.
#
# Neither database is reachable from a laptop or from a GitHub runner: the Mongo
# instance is on EC2 inside the VPC and `oxy-postgres` is `publicly_accessible =
# false`. So the runner does not copy anything itself — it starts a one-off ECS
# task on the same image, subnets and security group the service already uses,
# which is a place that can see both, and then reports what that task did.
#
# Safe to run more than once: the copier writes by `_id` and never deletes, so a
# second pass updates what changed in Mongo since the first and leaves the rest
# alone. That is the point — run it once days before the cutover to prove it
# works, and again during the window to catch the edits in between.
name: Copy Mongo to Postgres

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "copy" to confirm. Writes to the production Postgres.'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  CLUSTER: oxy-cluster
  SERVICE: website-api

jobs:
  copy:
    runs-on: ubuntu-24.04-arm
    steps:
      # Through `env`, not interpolated into the script: a workflow input is
      # attacker-controlled text as far as the shell is concerned.
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "copy" ]; then
            echo "::error::Type 'copy' in the confirm field to run this."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # The task definition and the networking come from the RUNNING service,
      # not from a value written here: a copy must use the same image and the
      # same secrets the API is actually using, and Terraform is not the
      # authority on either.
      - name: Read the running service
        id: svc
        run: |
          SVC=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].{td:taskDefinition,net:networkConfiguration.awsvpcConfiguration}' --output json)
          echo "td=$(echo "$SVC" | jq -r .td)" >> "$GITHUB_OUTPUT"
          echo "subnets=$(echo "$SVC" | jq -r '.net.subnets | join(",")')" >> "$GITHUB_OUTPUT"
          echo "sgs=$(echo "$SVC" | jq -r '.net.securityGroups | join(",")')" >> "$GITHUB_OUTPUT"
          echo "$SVC"

      - name: Confirm the task definition carries both connection strings
        run: |
          NAMES=$(aws ecs describe-task-definition --task-definition "${{ steps.svc.outputs.td }}" \
            --query 'taskDefinition.containerDefinitions[0].secrets[].name' --output text)
          echo "secrets: $NAMES"
          echo "$NAMES" | tr '\t' '\n' | grep -qx 'MONGO_URI' || { echo "::error::MONGO_URI is not on the task definition — nothing to copy FROM."; exit 1; }
          echo "$NAMES" | tr '\t' '\n' | grep -qx 'DATABASE_URL' || { echo "::error::DATABASE_URL is not on the task definition — nothing to copy TO. See docs/POSTGRES-CUTOVER.md step 2."; exit 1; }

      - name: Run the copy as a one-off task
        id: run
        run: |
          ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "${{ steps.svc.outputs.td }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.svc.outputs.subnets }}],securityGroups=[${{ steps.svc.outputs.sgs }}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"website-api","command":["bun","server/db/copyFromMongo.ts"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
            echo "::error::run-task did not start a task"
            exit 1
          fi
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "task: $ARN"

      - name: Wait for it to finish
        run: aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "${{ steps.run.outputs.arn }}"

      # The task's own log stream is the record of what was copied — per
      # collection read/written counts, then the row counts read back out of
      # Postgres. Printed here so the run page carries it.
      - name: Print the copy log
        run: |
          ID="${{ steps.run.outputs.arn }}"; ID="${ID##*/}"
          aws logs get-log-events --log-group-name /oxy/ecs --log-stream-name "website-api/website-api/$ID" \
            --limit 500 --no-start-from-head --query 'events[].message' --output text || \
            echo "::warning::log stream not readable yet; look for website-api/website-api/$ID in /oxy/ecs"

      - name: Fail if the copy did not exit cleanly
        run: |
          CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "${{ steps.run.outputs.arn }}" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "${{ steps.run.outputs.arn }}" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "exit code: $CODE ($REASON)"
          [ "$CODE" = "0" ] || exit 1
